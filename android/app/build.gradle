plugins { id "com.android.application" }

def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace "app.chartterminal"
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "String", "BUG_REPORT_HOST", "\"${project.findProperty('bugReportHost') ?: ''}\""
        applicationId "app.chartterminal"
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName "0.1.10"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps["storeFile"])
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }
    buildTypes {
        // Debug builds (WebView debugging on) are a separate app next to the real one: own id, own data, the default debug key; they can never replace or read the release app.
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation "junit:junit:4.13.2" }

// One app: the built web app (npm run build -> ../dist) is bundled into assets/www for the local mode (no server, Binance only).
def www = layout.projectDirectory.dir("src/main/assets/www")
tasks.register("syncWebAssets", Sync) {
    from(rootProject.file("../dist")) { exclude "sw.js", "**/*.map" }   // the service worker is not registered in the bundled app
    into www
    doFirst {
        if (!rootProject.file("../dist/index.html").exists()) throw new GradleException("dist/ is missing: run `npm run build` in the project root first (or `npm run build:android`).")
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn "syncWebAssets" }

// Chart-Terminal-<version>-android.apk (debug builds get a -debug suffix)
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = "Chart-Terminal-${variant.versionName}-android${variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name}.apk" }
}
