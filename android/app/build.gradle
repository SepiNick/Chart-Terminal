plugins { id "com.android.application" }

def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace "app.chartterminal"
    compileSdk 35
    defaultConfig {
        applicationId "app.chartterminal"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps["storeFile"])
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
