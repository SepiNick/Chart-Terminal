plugins { id "com.android.application" }

def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace "app.chartterminal"
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "String", "BUG_REPORT_HOST", "\"${project.findProperty('bugReportHost') ?: ''}\""
        applicationId "app.chartterminal"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "0.1.9"
    }
    // client = thin client (asks for a server address); standalone = bundles dist/ and needs no server.
    flavorDimensions "mode"
    productFlavors {
        client { dimension "mode"; manifestPlaceholders = [appLabel: "Chart Terminal"] }
        standalone { dimension "mode"; applicationIdSuffix ".standalone"; versionNameSuffix "-standalone"; manifestPlaceholders = [appLabel: "Chart Terminal Standalone"] }
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps["storeFile"])
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }
    buildTypes {
        // Debug builds (WebView debugging on) are a separate app next to the real one: own id, own data, the default debug key; they can never replace or read the release app.
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Standalone: copy the built web app (npm run build -> ../dist) into the flavor's assets before they are merged.
def standaloneWww = layout.projectDirectory.dir("src/standalone/assets/www")
tasks.register("syncStandaloneAssets", Sync) {
    from(rootProject.file("../dist")) { exclude "sw.js", "**/*.map" }   // the service worker is not registered in the bundled app
    into standaloneWww
    doFirst {
        if (!rootProject.file("../dist/index.html").exists()) throw new GradleException("dist/ is missing: run `npm run build` in the project root first (or `npm run build:android-standalone`).")
    }
}
tasks.matching { it.name ==~ /merge(Standalone\w*)Assets/ || it.name ==~ /lintVitalAnalyze(Standalone\w*)/ || it.name ==~ /generate(Standalone\w*)LintVitalReportModel/ }.configureEach { dependsOn "syncStandaloneAssets" }
