# Builds the Linux desktop packages (AppImage, deb, and pacman for Arch) on a Linux runner, since they cannot be built on Windows.
# Run it by hand: Actions > Linux packages > Run workflow, with the release tag to attach the files to (e.g. v0.1.2).
# The build job can only read the repository (npm install scripts run there); only the small upload job may write releases.
name: Linux packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the packages to (empty = only keep them as a run artifact)
        required: false
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot
      - run: npm ci && npm --prefix server ci && npm --prefix desktop ci
      - run: npm test
      - run: npm --prefix server test
      - run: npm --prefix desktop run dist:linux
      - name: Collect
        run: |
          mkdir out
          cp desktop/release/*.AppImage desktop/release/*.deb desktop/release/*.pacman out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: out/* }
  release:
    needs: linux
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: linux-packages, path: out }
      - name: Attach to the release
        run: |
          cd out
          v="${TAG#v}"
          mv ./*.AppImage "Chart-Terminal-${v}-linux-x64.AppImage"
          mv ./*.deb "Chart-Terminal-${v}-linux-amd64.deb"
          mv ./*.pacman "Chart-Terminal-${v}-linux-x64.pacman"
          gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
