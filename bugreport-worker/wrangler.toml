# Chart Terminal bug-report receiver. Deploy: `npx wrangler deploy` (see README.md).
name = "chart-terminal-bugreport"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
TELEGRAM_CHAT_ID = "REPLACE_WITH_YOUR_CHAT_ID"   # your personal chat (see README step 3)
# GITHUB_REPO = "SepiNick/tradingview-clone"      # optional: also open an issue (needs the GITHUB_TOKEN secret)
DIFFICULTY = "16"      # proof-of-work bits: 16 is about a second on a phone
IP_PER_HOUR = "5"
PER_DAY = "300"

# Replay guard and the limits: one Durable Object (SQLite-backed, available on the free plan). Nothing to create by hand.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"
